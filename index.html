<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News Hub</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <nav>
    <div class="main-nav container flex">
      <a href="#" class="company-logo" id="home-button">
        <img src="./asset/logo.png" alt="company logo" title="Home"/>
      </a>

      <div class="nav-links">
        <ul class="flex">
          <li class="hover-link nav-item" id="ipl" onclick="onNavItemClick('ipl')">IPL</li>
          <li class="hover-link nav-item" id="finance" onclick="onNavItemClick('finance')">Finance</li>
          <li class="hover-link nav-item" id="politics" onclick="onNavItemClick('politics')">Politics</li>
        </ul>
      </div>

      <div class="search-bar flex">
        <input type="text" class="news-input" placeholder="e.g. Science" />
        <button id="search-button" class="search-button">Search</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="cards-container container flex" id="cards-container"></div>
  </main>

  <template id="template-news-card">
    <div class="card">
      <div class="card-header">
        <img src="" alt="news-img" class="news-img" />
      </div>
      <div class="card-content">
        <h3 class="news-title">Title</h3>
        <h6 class="news-source">Source • Date</h6>
        <p class="news-desc">Description</p>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
